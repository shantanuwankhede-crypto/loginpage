<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
       <title>Login Page</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    </head>
</html>
 <style>
   
body {
      background: linear-gradient(to bottom, #823cad, #8450c3);
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      color: #fff;
    }
    .login-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 900px;
      margin: 60px auto;
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .form-control {
      border-radius: 0;
      border-color: #ccc;
      padding-left: 35px;
    }

    .input-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
    }

    .login-btn {
      width: 100%;
      background: #5c9ded;
      border: none;
      padding: 10px;
      color:whitesmoke;
      border-radius: 5px;
      font-weight: 600;
    }

     .social-links a {
    color:#5c9ded;
    margin: 0 10px;
    font-size: 24px;
    transition: 0.3s;
    }
    .social-links a:hover {
    color: #7c5cff;
    }

     .login-left img {
      width: 100%;
    } 
  </style>
</head>
<body>

<div class="container">
  <div class="login-card row align-items-center">

    
    <div class="col-md-6 login-left text-center">
      <img src="./image/loginsign.png" alt="Login Illustration" />

    </div>

    
    <div class="col-md-6">
      <h3 class="login-title">Log In</h3>

      <div class="mb-3 position-relative">
        <i class="bi bi-person input-icon"></i>
        <input type="email" class="form-control" placeholder="Your Email" />
      </div>

      <div class="mb-3 position-relative">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" class="form-control" placeholder="Password" />
      </div>

      <!-- <div class="d-flex justify-content-between align-items-center mb-3 "style="color:#7c5cff">
        <div>
          <input type="checkbox" /> Remember me
        </div>
        <a href="#" class="text-decoration-none">Forgot password?</a>
      </div> -->

      <button class="login-btn mb-3">Log In</button>
      <a href="#" class="text-decoration-none">Create an account</a>
      <p class="mt-3 mb-2"style="color:#7c5cff">Or login with</p>

     <footer class="text-right md-4" style="background-color:#fff; color:#5c9ded; text-align:left; padding:25px 0;">
     <div class="social-links"> 
      <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook"></i></a>
      <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://twitter.com" target="_blank"><i class="fa-brands fa-twitter"></i></a>
      
      
     </div>
     </footer>
     </div>
  </div>
</div>

</body>
</html>
